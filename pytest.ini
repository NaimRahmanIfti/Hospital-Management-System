# pytest.ini — pytest reads this automatically.
[pytest]
# Where the tests live
testpaths = tests
# -q: quiet output. -rxX: list expected failures (our known bugs) in the summary.
addopts = -q -rxX
# Hide noisy deprecation warnings from libraries we don't control
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
